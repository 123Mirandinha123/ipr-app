<ion-app>
  <div class="splash-overlay" *ngIf="mostrandoSplash" [class.splash-hide]="splashEscondendo">
    <img src="assets/icon/splashscreenIPr.png" alt="" class="splash-overlay-img" />
  </div>
  <ion-menu side="end" contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <ng-container *ngIf="usuario; else semSessao">
        <div class="menu-user-info">
          <ion-avatar class="menu-avatar">
            <span class="avatar-text">{{ usuario.nome.substring(0, 1) }}</span>
          </ion-avatar>
          <h3 class="menu-nome">{{ usuario.nome }}</h3>
          <p class="menu-email">{{ usuario.email }}</p>
          <div class="badges">
            <ion-badge *ngIf="isAdmin" color="warning">Admin</ion-badge>
            <ion-badge *ngIf="isLeader" color="success">Líder</ion-badge>
          </div>
        </div>
        <ion-list lines="full">
          <ion-item button (click)="abrirPerfil()">
            <ion-icon name="person-circle-outline" slot="start"></ion-icon>
            <ion-label>Perfil</ion-label>
          </ion-item>
          <ion-item button (click)="abrirMinhasEscalas()">
            <ion-icon name="calendar-outline" slot="start"></ion-icon>
            <ion-label>Escalas</ion-label>
          </ion-item>
          <ion-item *ngIf="isAdmin" button (click)="abrirEscalasDoDia()">
            <ion-icon name="today-outline" slot="start"></ion-icon>
            <ion-label>Escalas do Dia</ion-label>
          </ion-item>
          <ion-item *ngIf="isAdmin || isLeader" button (click)="abrirMembros()">
            <ion-icon name="people-outline" slot="start"></ion-icon>
            <ion-label>Membros</ion-label>
          </ion-item>
          <ion-item button (click)="abrirIndisponibilidades()">
            <ion-icon name="close-circle-outline" slot="start"></ion-icon>
            <ion-label>Indisponibilidades</ion-label>
          </ion-item>
          <ion-item *ngIf="isAdmin || isLeader" button (click)="abrirMensagens()">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-label>Mensagens</ion-label>
          </ion-item>
          <ion-item *ngIf="isAdmin || isLeader" button (click)="abrirFamilias()">
            <ion-icon name="people-circle-outline" slot="start"></ion-icon>
            <ion-label>Famílias</ion-label>
          </ion-item>
          <ion-item *ngIf="isAdmin || isLeader" button (click)="abrirCompartilhar()">
            <ion-icon name="logo-whatsapp" slot="start"></ion-icon>
            <ion-label>Compartilhar Escalas</ion-label>
          </ion-item>
          <ion-item button (click)="logout()" class="logout-item">
            <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
            <ion-label color="danger">Sair</ion-label>
          </ion-item>
        </ion-list>
      </ng-container>
      <ng-template #semSessao>
        <p class="sem-sessao">Nenhum usuário logado.</p>
      </ng-template>
    </ion-content>
  </ion-menu>
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
