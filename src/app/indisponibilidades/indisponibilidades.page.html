<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Indisponibilidades</ion-title>

    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Bloco Superior Informativo com Ícone -->
  <div class="instrucao-wrapper">
    <div class="instrucao-icon-box">
      <ion-icon name="calendar-clear-outline"></ion-icon>
    </div>
    <p class="instrucao-texto">
      Selecione um ministério para gerenciar suas indisponibilidades
    </p>
  </div>

  <ng-container *ngIf="ministerios.length > 0; else vazio">

    <div class="ministerios-container">
      <div
        class="indisp-card-item"
        *ngFor="let m of ministerios"
        (click)="abrirPorMinisterio(m.chave)"
      >
        <div class="card-left">
          <div
            class="ministerio-icon-box"
            [style.color]="corIconeMinisterio(m.chave)"
            [style.border-color]="corIconeMinisterio(m.chave)"
          >
            <ion-icon [name]="iconeMinisterio(m.chave)"></ion-icon>
          </div>
          <div class="ministerio-textos">
            <span class="ministerio-nome">{{ m.nome }}</span>
            <span class="ministerio-qtd">
              {{ m.qtd }} indisponibilidade(s)
            </span>
          </div>
        </div>
        <ion-icon name="chevron-forward-outline" class="chevron-arrow"></ion-icon>
      </div>
    </div>

  </ng-container>

  <ng-template #vazio>
    <div class="vazio-container">
      <ion-icon name="close-circle-outline" class="vazio-icon"></ion-icon>
      <p class="vazio">Nenhum ministério disponível</p>
    </div>
  </ng-template>

</ion-content>

<app-bottom-nav activeTab="todos"></app-bottom-nav>
