<ion-content style="--background: url('assets/icon/fundoipr.png') no-repeat center center / cover;">
  <div class="login-wrapper">
    <img src="assets/LogoDourado.png" alt="Logo IPR" class="logo" />

    <form class="login-card" (ngSubmit)="login()" novalidate>
      <div class="input-field-wrapper">
        <ion-icon name="mail-outline" class="field-icon"></ion-icon>
        <div class="field-content">
          <label class="field-label" for="login-email">Email</label>
          <input
            id="login-email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="seu@email.com"
            autocomplete="username"
            class="custom-input"
          />
        </div>
      </div>

      <div class="input-field-wrapper">
        <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
        <div class="field-content">
          <label class="field-label" for="login-password">Senha</label>
          <input
            id="login-password"
            name="password"
            [type]="mostrarSenha ? 'text' : 'password'"
            [(ngModel)]="senha"
            placeholder="Sua senha"
            autocomplete="new-password"
            autocorrect="off"
            autocapitalize="off"
            class="custom-input"
          />
        </div>
        <button
          type="button"
          class="btn-toggle-eye"
          (click)="mostrarSenha = !mostrarSenha"
          aria-label="Mostrar ou esconder senha"
        >
          <ion-icon [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>

      <ion-text color="danger" *ngIf="erro">
        <p class="erro">{{ erro }}</p>
      </ion-text>

      <button
        type="submit"
        class="btn-login"
        [disabled]="carregando"
      >
        <ion-spinner *ngIf="carregando" name="crescent"></ion-spinner>
        <ng-container *ngIf="!carregando">
          <ion-icon name="log-in-outline" class="btn-icon"></ion-icon>
          <span>Entrar</span>
        </ng-container>
      </button>

      <!-- Botão de Biometria (quando habilitado / suportado) -->
      <button
        *ngIf="biometriaAtiva"
        type="button"
        class="btn-biometria"
        (click)="loginComBiometria()"
        [disabled]="carregando"
      >
        <ion-icon name="finger-print-outline" class="btn-biometria-icon"></ion-icon>
        <span>Entrar com {{ tipoBiometriaTexto }}</span>
      </button>

      <div class="login-card-footer">
        <span class="footer-line"></span>
        <ion-icon name="globe-outline" class="footer-icon"></ion-icon>
        <span class="footer-line"></span>
      </div>
    </form>
  </div>
</ion-content>
