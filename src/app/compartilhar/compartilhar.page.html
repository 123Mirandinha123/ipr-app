<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Compartilhar Escalas</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Spinner de Carregamento Inicial -->
  <div *ngIf="carregando" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Carregando escalas para compartilhar...</p>
  </div>

  <!-- Botão Compartilhar Tudo -->
  <div class="compartilhar-tudo-box" *ngIf="!carregando && isAdmin && grupos.length > 0">
    <button class="btn-compartilhar-tudo" (click)="compartilharTudo()">
      <ion-icon name="logo-whatsapp"></ion-icon>
      <span>Compartilhar tudo</span>
    </button>
  </div>

  <!-- Lista de Grupos/Ministérios -->
  <div class="grupos-container" *ngIf="!carregando && grupos.length > 0">
    <div class="grupo-card" *ngFor="let grupo of grupos">
      <div class="grupo-info">
        <h2 class="grupo-nome">{{ grupo.nome }}</h2>
        <span class="grupo-qtd">{{ grupo.escalas.length }} escala(s) no mês</span>
      </div>

      <button class="btn-whatsapp-circular" (click)="compartilharMinisterio(grupo)" aria-label="Compartilhar no WhatsApp">
        <ion-icon name="logo-whatsapp"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Estado Vazio -->
  <div class="vazio-container" *ngIf="!carregando && grupos.length === 0">
    <ion-icon name="share-social-outline" class="vazio-icon"></ion-icon>
    <p class="vazio-texto">Nenhuma escala encontrada para este mês.</p>
  </div>

</ion-content>

<app-bottom-nav activeTab="todos"></app-bottom-nav>
