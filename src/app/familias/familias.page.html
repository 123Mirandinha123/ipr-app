<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="" icon="chevron-back-outline"></ion-back-button>
    </ion-buttons>
    <ion-title>Famílias</ion-title>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding page-content">

  <p class="info-text">
    Crie famílias e adicione os membros. Na geração das escalas, pessoas da mesma família são priorizadas no mesmo dia e turno.
  </p>

  <ion-button *ngIf="podeGerenciar" expand="block" class="btn-nova-familia" (click)="novaFamilia()">
    <ion-icon slot="start" name="add-outline"></ion-icon>
    Nova Família
  </ion-button>

  <ng-container *ngIf="familias.length > 0; else vazio">
    <div class="cards-container">
      <div class="familia-neon-card" *ngFor="let familia of familias; let idx = index">
        <div class="card-header">
          <ion-input
            [id]="'familia-nome-' + (familia.id || idx)"
            [name]="'familia-nome-' + (familia.id || idx)"
            [value]="familia.nome"
            [readonly]="!podeGerenciar"
            (ionBlur)="renomearFamilia(familia, $event.target.value)"
            class="nome-familia-input"
          ></ion-input>
          
          <button *ngIf="podeGerenciar" class="btn-excluir-clean" (click)="excluirFamilia(familia)" title="Excluir família">
            <ion-icon name="trash-outline" class="trash-icon"></ion-icon>
          </button>
        </div>

        <div class="membros-list">
          <div class="membro-row" *ngFor="let uid of familia.membros">
            <div class="membro-info">
              <div class="membro-avatar">
                <img *ngIf="getFotoMembro(uid)" [src]="getFotoMembro(uid)" alt="Foto" />
                <span *ngIf="!getFotoMembro(uid)">{{ getInicialMembro(uid) }}</span>
              </div>
              <span class="membro-nome">{{ getNomeMembro(uid) }}</span>
            </div>

            <button *ngIf="podeGerenciar" class="btn-remover-membro" (click)="removerMembro(familia, uid)">
              <span>Remover</span>
              <ion-icon name="close-outline"></ion-icon>
            </button>
          </div>
        </div>

        <div class="card-footer" *ngIf="podeGerenciar">
          <div class="add-membro-trigger">
            <ion-icon name="add-outline" class="add-icon"></ion-icon>
            <ion-select
              [value]="''"
              placeholder="Adicionar membro"
              interface="popover"
              (ionChange)="adicionarMembro(familia, $event.detail.value); $event.target.value = ''"
              class="select-membro"
            >
              <ion-select-option *ngFor="let u of getDisponiveis(familia)" [value]="u.uid">
                + {{ u.nome }}
              </ion-select-option>
            </ion-select>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #vazio>
    <div class="empty-state">
      <ion-icon name="people-outline" class="empty-icon"></ion-icon>
      <p>Nenhuma família criada ainda.</p>
    </div>
  </ng-template>

</ion-content>

<app-bottom-nav activeTab="todos"></app-bottom-nav>
