<ion-header>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Escalas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="usuario-info" *ngIf="usuario">
    <ion-badge color="medium">{{ getNomeUsuario() }}</ion-badge>
    <ion-badge *ngIf="authService.isLeader" color="success">Lider</ion-badge>
    <ion-badge *ngIf="authService.isAdmin" color="warning">Admin</ion-badge>
  </div>

  <div class="departamentos-container">
    <div
      class="depto-card"
      *ngFor="let dep of departamentosVisiveis"
      [routerLink]="'/escalas/' + dep.chave"
      (click)="blurActiveElement()"
    >
      <div class="depto-left">
        <div class="depto-badge" [ngStyle]="{ 'background': dep.gradiente, 'box-shadow': dep.sombra }">
          <ion-icon [name]="dep.icone"></ion-icon>
        </div>
        <div class="depto-textos">
          <span class="depto-titulo">{{ dep.nome }}</span>
          <span class="depto-status" [class.gerada]="dep.qtdEscalas > 0">
            {{ dep.qtdEscalas > 0 ? (dep.qtdEscalas + ' Escala Gerada') : 'Escala Pendente' }}
          </span>
        </div>
      </div>

      <div class="depto-membros">
        {{ dep.qtdMembros }} {{ dep.qtdMembros === 1 ? 'membro' : 'membros' }}
      </div>
    </div>
  </div>

  <div class="acoes-container" *ngIf="authService.isAdmin">
    <button class="btn-criar-todas" (click)="criarTodasEscalas()">
      <ion-icon name="calendar-outline" class="btn-icon"></ion-icon>
      <span>Criar todas as escalas do mês</span>
    </button>

    <button class="btn-excluir-todas" (click)="excluirTodasEscalas()">
      <ion-icon name="trash-outline" class="btn-icon-red"></ion-icon>
      <span>Excluir todas as escalas</span>
    </button>
  </div>

</ion-content>

<app-bottom-nav activeTab="escalas"></app-bottom-nav>
