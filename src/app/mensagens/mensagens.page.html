<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>Mensagens</ion-title>

    <ion-buttons slot="end">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Spinner de Carregamento Inicial -->
  <div *ngIf="carregando" class="loading-container">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Carregando mensagens...</p>
  </div>

  <ng-container *ngIf="!carregando && mensagens.length > 0; else vazio">

    <div class="mensagens-container">
      <div class="mensagem-card-item" *ngFor="let msg of mensagens">
        
        <!-- Avatar Limpo (com foto ou silhueta sem letras ao lado) -->
        <div class="avatar-box">
          <img *ngIf="msg.foto" [src]="msg.foto" alt="" class="avatar-img" />
          <div *ngIf="!msg.foto" class="avatar-default">
            <ion-icon name="person"></ion-icon>
          </div>
        </div>

        <!-- Conteúdo: Nome e Motivo -->
        <div class="mensagem-conteudo">
          <span class="mensagem-nome">{{ msg.nome }}</span>
          <span class="mensagem-motivo">{{ msg.motivoTexto }}</span>
        </div>

        <!-- Data no canto direito -->
        <div class="mensagem-data">
          {{ msg.dataResumida }}
        </div>

      </div>
    </div>

  </ng-container>

  <ng-template #vazio>
    <div class="vazio-container">
      <ion-icon name="mail-outline" class="vazio-icon"></ion-icon>
      <p class="vazio">Nenhuma mensagem ou motivo de indisponibilidade registrado.</p>
    </div>
  </ng-template>

</ion-content>

<app-bottom-nav activeTab="mensagens"></app-bottom-nav>
